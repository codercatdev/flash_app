    <title>Flash Image Studio</title>
    <meta
      name="description"
      content="Text-to-image on Runpod Flash serverless GPUs, fronted by Cloudflare Workers."
    />

    <!-- Served from web/public/ at the site root. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
